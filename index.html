<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BV Training Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single-column workbook — workflow filter, quiz index cards, then a one-question-at-a-time quiz runner. */
:root {
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --ink: #142033;
  --muted: #586579;
  --line: #DCE2EA;
  --accent: #1D3F8F;       /* member-ID-card blue */
  --accent-soft: #E6ECF8;
  --mark: #FFE7A3;         /* EOB highlighter */
  --mark-ink: #4A3A00;
  --good: #1C7A4B;
  --good-soft: #E3F3EA;
  --bad: #B3261E;
  --bad-soft: #FBE7E5;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1520; --surface: #171F2D; --ink: #E7ECF3; --muted: #9AA6B8; --line: #2A3546;
    --accent: #8FAEF0; --accent-soft: #1E2A44; --mark: #5A4A12; --mark-ink: #FFE7A3;
    --good: #5CC48F; --good-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1A18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1520; --surface: #171F2D; --ink: #E7ECF3; --muted: #9AA6B8; --line: #2A3546;
  --accent: #8FAEF0; --accent-soft: #1E2A44; --mark: #5A4A12; --mark-ink: #FFE7A3;
  --good: #5CC48F; --good-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1A18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.head { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-size: 0.88rem; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* sections */
.section { display: grid; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; }
.tag.all { background: var(--mark); color: var(--mark-ink); }
.card p { color: var(--muted); font-size: 0.9rem; }
.card .foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; margin-top: 4px; }
.best { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.best.pass { color: var(--good); }
.best.fail { color: var(--bad); }
.final { border-style: dashed; }

/* quiz runner */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: none; color: var(--accent); padding: 0; font-weight: 500; }
.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.count { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 18px; }
.qtext { font-size: 1.12rem; font-weight: 600; line-height: 1.45; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left;
  border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 14px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--f-mono); font-size: 0.8rem; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt.dim { opacity: .6; }
.feedback { border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback strong { font-family: var(--f-display); }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.src { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 10px 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.hint { font-size: 0.78rem; color: var(--muted); }

/* results */
.score { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.big { font-family: var(--f-display); font-size: clamp(2.6rem, 8vw, 3.6rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.pill { font-family: var(--f-mono); font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
.pill.pass { background: var(--good-soft); color: var(--good); }
.pill.fail { background: var(--bad-soft); color: var(--bad); }
.review { display: grid; gap: 10px; }
.miss { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; }
.miss .yours { color: var(--bad); font-size: 0.9rem; }
.miss .ans { color: var(--good); font-size: 0.9rem; font-weight: 500; }
.miss .why { color: var(--muted); font-size: 0.9rem; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px; }
.note { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
/* performance report */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .v { font-family: var(--f-display); font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .l { font-size: 0.8rem; color: var(--muted); }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.t { white-space: normal; min-width: 180px; }
tr:last-child td { border-bottom: none; }
.up { color: var(--good); } .down { color: var(--bad); }
.segs { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.seg { display: grid; grid-template-columns: minmax(120px, 1.3fr) 2fr 96px; gap: 12px; align-items: center; font-size: 0.9rem; }
.meter { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; }
.meter > i.pass { background: var(--good); } .meter > i.fail { background: var(--bad); }
.seg .pct { white-space: nowrap; font-family: var(--f-mono); font-size: 0.82rem; text-align: right; font-variant-numeric: tabular-nums; }
.namebox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
.namebox input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; flex: 1 1 200px; max-width: 320px; }
.printonly { display: none; }
.field { display: grid; gap: 6px; font-weight: 500; font-size: 0.9rem; }
.field input { font: inherit; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; max-width: 420px; }
.err { color: var(--bad); font-size: 0.85rem; }
@media (max-width: 560px) { .seg { grid-template-columns: 1fr 96px; } .seg .meter { grid-column: 1 / -1; grid-row: 2; } }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .noprint, .chips, .back, .actions, .namebox { display: none !important; }
  .printonly { display: block; }
  .card, .tile, .tablewrap, .segs, .miss, .qcard { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

{

  qs: [
    ["What is the SLA for a PharmBV case?", ["4 hours","7 hours","6 hours","24 hours"], "PharmBV must close within 4h. MedBV and Transportation get 7h, PriorAuth gets 6h. A breach brings a client penalty.", "A–Z · Slide 7"],
    ["Which workflows share the 7-hour SLA?", ["MedBV and Transportation","PharmBV and PriorAuth","MedBV and PriorAuth","All four workflows"], "MedBV / Transportation = 7h, PriorAuth = 6h, PharmBV = 4h.", "A–Z · Slide 7"],
    ["What does the 3 + 1 rule mean?", ["A maximum of 3 AI attempts plus 1 Human attempt per case","3 Human attempts plus 1 AI attempt per case","3 pushbacks plus 1 escalation per call","3 stacked cases plus the original case on one call"], "The 3 + 1 pattern is the 100ms standard: up to 3 AI calls, then 1 Human call.", "A–Z · Slide 8"],
    ["You believe a case needs a second Human call. What must you do first?", ["Confirm with your Supervisor before making the attempt","Make the call, then add a note afterwards","Ask the AI Auditor to re-run the case","Reassign the case to another agent"], "Some cases do need a second Human call, but only after the Supervisor confirms.", "A–Z · Slide 8"],
    ["You are stepping away for a break. What should you do on the dashboard?", ["Switch your status to Not Available","Log out and log back in after the break","Keep your status Available so the queue keeps moving","Close the browser tab"], "Click your initials at the bottom left. If you stay Available, cases keep getting assigned to you.", "A–Z · Slide 4"],
    ["Why log out at the end of your day instead of staying logged in?", ["The dashboard auto-logs out after 24 hours and can throw you out mid-call, causing rework","Cases can't be assigned while you are logged in","The SLA timer only pauses when you log out","Staying logged in marks you Not Available"], "Auto-logout happens after 24 hours. If it hits during a call, you lose work.", "A–Z · Slide 4"],
    ["When you open a case summary, what do you check first in the Output section?", ["The Case Disposition","The Timeline","The provider details in Input","The Call 3 tab"], "Disposition tells you what happened, e.g. Benefits Partially Verified, Need Live Agent or Third Party Pushback.", "A–Z · Slide 10"],
    ["What does the yellow Chain of Thoughts button under a question show?", ["A short summary of what happened on the call for that question, answered or not","The exact moment on the recording where the answer was given","The list of fields still missing on the case","The AI Auditor's escalation reasons"], "Yellow = Chain of Thoughts (short summary). Blue = Evidence (jumps to the exact moment on the call).", "A–Z · Slide 11"],
    ["Which tab shows the information still to be collected on a case?", ["Missed","Timeline","Review","Evidence"], "Click Missed to see which information still needs to be collected.", "A–Z · Slide 10"],
    ["After all AI attempts finish, who decides between Mark as Complete and Escalate to Human?", ["The AI Auditor","Your Supervisor","The payer rep","The client program"], "The built-in AI Auditor runs once all AI attempts are done. Click AI Audit to see escalation reasons.", "A–Z · Slide 15"],
    ["PBM workflow: a field is missing because the AI never asked the question. What happens?", ["A Human call is mandatory for that information","Look it up in the LMS portal and close without a call","Mark the case complete with a note","Wait for the AI to make a 4th attempt"], "If the AI missed the question, a Human call is mandatory for it.", "A–Z · Slide 16"],
    ["PBM workflow: the AI asked, but the rep cited “third party restrictions”. How do you decide on a Human call?", ["Check that field in the LMS portal under PBM Field Reference: Accepted = no Human call, Not Accepted = Human call is mandatory","Always make a Human call","Never make a Human call when the rep refused","Email the client program and wait"], "Reasons like “information unavailable” are checked against the PBM Field Reference in the LMS portal.", "A–Z · Slide 16"],
    ["Where do you find how to get through a specific payer's IVR?", ["The LMS portal, under Payer IVR Navigation","The case Timeline","The Handoff actions panel","The Human Call Script"], "Every payer's IVR is different. Look the payer up in the LMS portal under Payer IVR Navigation.", "A–Z · Slide 19"],
    ["On a Human call, you collect benefit information before verifying the member's details. What is this?", ["A HIPAA compliance failure","Acceptable if the rep offers it","Fine as long as you verify before hanging up","A call-stacking error"], "Collecting any information before verifying member details counts as a HIPAA compliance failure.", "A–Z · Slide 20"],
    ["The rep gives a long bundle of information faster than you can type. Which feature helps?", ["Heard: it leaves a yellow ear marker you click after the call to jump to that moment","Search transcription","Stack call","Regenerate summary"], "Click Heard; after the call, click the ear icon to jump to that moment in the recording.", "A–Z · Slide 22"],

    ["A suggested value differs from what you entered. What do you do?", ["Verify it with the Evidence button or the search tab before accepting","Accept it, since you can undo with one click","Ignore it; your entry always wins","Delete both values and leave the field blank"], "There's no one-click undo, and double-checking a differing suggested value is mandatory.", "A–Z · Slides 29–30"],
    ["Information is still missing after your Human attempt. Where do you record the reason?", ["In Notes under Payer Call Details, alongside relevant system notes","In the Chain of Thoughts box","In the Timeline","Nowhere; leave the field blank"], "Keep relevant system-generated notes and add yours alongside them.", "A–Z · Slide 30"],

},
{
  id: "mm-foundations", wf: "medbv", title: "Healthcare Foundations",
  source: "Deck 1 · Modules 1–4",
  blurb: "Revenue cycle, insurance types, Medicare parts, plan types, medical vs pharmacy benefit, and codes.",
  qs: [
    ["In the 9-step revenue cycle, which step is benefits verification?", ["Step 2: Verify eligibility and benefits","Step 1: Schedule","Step 3: Authorization","Step 6: Adjudicate"], "Step 2 is us. If step 2 is wrong, every step after it can go wrong.", "Deck 1 · Slide 9"],
    ["The rep confirms the plan is active. What can you conclude about the drug?", ["Nothing yet; an active plan does not mean the drug is covered","The drug is covered","The drug is covered but needs PA","The drug is covered under pharmacy only"], "The biggest beginner mistake. A plan can be active while the drug is excluded, needs PA, or is pharmacy-only.", "Deck 1 · Slide 12"],

    ["Can a patient have Medicare Advantage and Medigap together?", ["No; Medigap works only with Original Medicare","Yes; Medigap pays first","Yes; Medicare Advantage becomes secondary","Only for Part D drugs"], "Medigap works only with Original Medicare and is always secondary.", "Deck 1 · Slide 23"],
    ["Which payer usually pays last when the patient has other insurance?", ["Medicaid","A commercial employer plan","Medicare Advantage","An individual Marketplace plan"], "Medicaid is run by each state and usually pays last.", "Deck 1 · Slide 24"],
    ["Which plan type needs a PCP, usually needs a referral, and covers out-of-network only for emergencies?", ["HMO","PPO","POS","EPO"], "EPO is also in-network only but usually needs no PCP or referral. The plan type is a hint, never a rule.", "Deck 1 · Slide 26"],

    ["The rep says the drug is “covered under pharmacy”. How is that recorded for MM?", ["Not covered under MM (a pharmacy carve-out)","Covered","Covered with PA","Pending review"], "“Covered under pharmacy” is NOT covered under MM. Module 16 covers what to collect.", "Deck 1 · Slide 35"],
    ["What does the CPT admin code tell the payer?", ["How the drug was given","Why the patient needs it","Where it was given","Which exact product and package was used"], "ICD-10 = why, J/Q = what, CPT = how, POS = where, NDC = which exact product.", "Deck 1 · Slide 38"],

{
  id: "mm-compliance", wf: "medbv", title: "Call Right: HIPAA and Compliance",
  source: "Deck 2 · Modules 5–8",

    ["You needed a second pushback to collect correct benefits and wrote the reason in the case note. Is this an escalation?", ["No","Yes, always","Only if the rep complains","Only on Medicare cases"], "Accuracy first. An extra call or second pushback with a noted reason is NOT an escalation.", "Deck 2 · Slide 16"],

    ["The rep says our plan is secondary. What must you collect?", ["The primary payer's name","Nothing; end the call","Only the secondary plan's group number","A copy of the primary member ID card"], "If our payer is not primary, always get the primary payer's name.", "Deck 3 · Slide 6"],
    ["The provider is in-network. Which benefits do you collect?", ["In-network benefits only","Out-of-network benefits only","Both in- and out-of-network","None"], "The exact collection rule is shown on the case for each program.", "Deck 3 · Slide 10"],

    ["Deductible $1,000, OOP max $4,000, deductible NOT included in OOP. Most the patient can pay in the year?", ["$5,000","$4,000","$3,000","$1,000"], "Not included → deductible plus the full OOP max on top. That's why you always ask.", "Deck 3 · Slide 20"],
    ["Deductible $500 (met $0), 10% coinsurance, OOP max $2,000 (ded included). Allowed amount $3,000. Patient pays?", ["$750","$800","$500","$300"], "$500 deductible + 10% of the remaining $2,500 ($250) = $750, under the OOP max.", "Deck 3 · Slide 30"],

    ["Rep: deductible $3,000, OOP max $2,500, 20% coinsurance. What do you do?", ["Hard pushback: the deductible can't be more than the OOP max","Record it as given","Ask about the office visit copay","Ask for the group number"], "Rule 1: deductible ≤ OOP max.", "Deck 3 · Slides 32–33"],

const COLLECT_URL = "https://script.google.com/macros/s/AKfycbx9Kj2ums6Qfgjubghi4iDus-LErxifUaLc6JjeOvI9-bWMGCambm1Ar9yXzaSlfO4V/exec";

function getBest() { try { return JSON.parse(localStorage.getItem("bvq-best") || "{}"); } catch (e) { return {}; } }
function saveBest(id, pct) {
  try {
    const m = getBest();
    if (m[id] == null || pct > m[id]) { m[id] = pct; localStorage.setItem("bvq-best", JSON.stringify(m)); }
  } catch (e) {}
}
const HKEY = "bvq-history";
function getHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch (e) { return []; } }
function saveAttempt(a) { try { const h = getHistory(); h.push(a); localStorage.setItem(HKEY, JSON.stringify(h)); } catch (e) {} }
function getUser() { try { const u = JSON.parse(localStorage.getItem("bvq-user") || "null"); return u && u.name ? u : null; } catch (e) { return null; } }
function setUser(u) { try { localStorage.setItem("bvq-user", JSON.stringify(u)); } catch (e) {} }
function getName() { const u = getUser(); return u ? u.name : ""; }

/* Outbox: results wait here until the Google Sheet confirms receipt, so nothing is lost offline. The sheet ignores duplicates by attempt ID. */
const QKEY = "bvq-outbox";
function getOutbox() { try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch (e) { return []; } }
function setOutbox(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
function post(p) {
  return fetch(COLLECT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) })
    .then(() => true, () => false);
}
async function flushOutbox() {
  if (!COLLECT_URL) return null;
  for (const p of getOutbox()) {
    if (await post(p)) setOutbox(getOutbox().filter(x => x.attemptId !== p.attemptId));
    else return false;
  }
  return true;
}
async function sendAttempt(p) {
  if (!COLLECT_URL) return null;
  setOutbox(getOutbox().concat(p));
  if (!getOutbox().some(x => x.attemptId === p.attemptId)) return post(p);
  return flushOutbox();
}
function newId() { try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {} return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10); }

function goHome() { if (location.hash && location.hash !== "#") location.hash = ""; else renderHome(); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function findQuiz(id) { return QUIZZES.find(q => q.id === id) || FINALS.find(f => f.id === id); }

function bestBadge(id) {

function fmtDate(t) { return new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
function fmtDur(s) { return s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s"; }

function renderReport() {
  run = null;
  const h = getHistory();
  const name = getName();
  const head =
    '<div class="bar"><button class="back" id="back">← All quizzes</button></div>' +
    '<header class="head"><span class="eyebrow">BV Training Quizzes · Performance report</span><h1>My performance</h1>' +
      '<p class="printonly" id="pname">' + (name ? "Agent: " + esc(name) + " · " : "") + "Printed " + fmtDate(Date.now()) + '</p>' +
      '<p class="lede noprint">Every attempt you make on this device is listed here. Use it to find weak topics, then revise the slides listed.</p>' +
      '<div class="namebox"><span>Agent: <strong>' + esc(name || "not set") + '</strong>' + (getUser() ? ' · ' + esc(getUser().empId) : '') + '</span><button class="back" id="who">Change</button></div>' +
    '</header>';
  if (!h.length) {
    app.innerHTML = head + '<div class="qcard"><p class="lede">No attempts yet. Take a quiz and your results will show up here.</p><div class="actions"><button class="btn" id="home2">Browse quizzes</button></div></div>';
    wireReport();
    return;
  }
  const avg = Math.round(h.reduce((a, x) => a + x.pct, 0) / h.length);
  const answered = h.reduce((a, x) => a + x.total, 0), correct = h.reduce((a, x) => a + x.score, 0);
  const tried = new Set(h.map(x => x.id));
  const passed = new Set(h.filter(x => x.pct >= PASS).map(x => x.id));
  const all = QUIZZES.concat(FINALS);
  const tile = (v, l) => '<div class="tile"><span class="v">' + v + '</span><span class="l">' + l + '</span></div>';
  const tiles = '<div class="tiles">' +
    tile(h.length, "Attempts") + tile(tried.size + " / " + all.length, "Quizzes tried") +
    tile(passed.size + " / " + all.length, "Quizzes passed (≥ " + PASS + "%)") +
    tile(avg + "%", "Average score") + tile(Math.round(correct / answered * 100) + "%", "Accuracy · " + correct + " of " + answered) + '</div>';

  const rows = all.map(q => {
    const at = h.filter(x => x.id === q.id);
    if (!at.length) return '<tr><td class="t">' + esc(q.title) + '</td><td>' + WF_LABEL[q.wf] + '</td><td class="num">0</td><td class="num">–</td><td class="num">–</td><td class="num">–</td><td>Not taken</td></tr>';
    const best = Math.max(...at.map(x => x.pct)), last = at[at.length - 1].pct, first = at[0].pct, d = last - first;
    const trend = at.length < 2 ? '<span class="count">–</span>' : '<span class="' + (d > 0 ? "up" : d < 0 ? "down" : "") + '">' + (d > 0 ? "+" : "") + d + ' pts</span>';
    const st = best >= PASS ? '<span class="best pass">Passed</span>' : '<span class="best fail">Not yet</span>';
    return '<tr><td class="t">' + esc(q.title) + '</td><td>' + WF_LABEL[q.wf] + '</td><td class="num">' + at.length + '</td><td class="num">' + best + '%</td><td class="num">' + last + '%</td><td class="num">' + trend + '</td><td>' + st + '</td></tr>';
  }).join("");
  const table = '<div class="tablewrap"><table><thead><tr><th>Quiz</th><th>Workflow</th><th class="num">Attempts</th><th class="num">Best</th><th class="num">Latest</th><th class="num">First → latest</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

  const agg = {};
  h.forEach(x => Object.entries(x.segs || {}).forEach(([k, [c, t]]) => { const g = agg[k] || (agg[k] = [0, 0]); g[0] += c; g[1] += t; }));
  const segRows = QUIZZES.filter(q => agg[q.id]).map(q => ({ q, c: agg[q.id][0], t: agg[q.id][1], p: Math.round(agg[q.id][0] / agg[q.id][1] * 100) }))
    .sort((a, b) => a.p - b.p)
    .map(r => '<div class="seg"><span>' + esc(r.q.title) + '</span><div class="meter" role="img" aria-label="' + r.p + '% correct"><i class="' + (r.p >= PASS ? "pass" : "fail") + '" style="width:' + r.p + '%"></i></div><span class="pct">' + r.p + '% · ' + r.c + '/' + r.t + '</span></div>').join("");
  const segs = '<div class="segs">' + segRows + '</div>';

  const mm = {};
  h.forEach(x => (x.missed || []).forEach(m => { const g = mm[m.q] || (mm[m.q] = Object.assign({ n: 0 }, m)); g.n++; }));
  const top = Object.values(mm).sort((a, b) => b.n - a.n).slice(0, 10);
  const missList = top.length ? '<div class="review">' + top.map(m =>
    '<div class="miss"><strong>' + esc(m.q) + '</strong><span class="ans">Correct: ' + esc(m.a) + '</span>' +
    '<span class="src">Missed ' + m.n + (m.n > 1 ? " times" : " time") + ' · ' + esc(segTitle(m.seg)) + ' · Revise: ' + esc(m.s) + '</span></div>').join("") + '</div>'
    : '<p class="lede">No missed questions so far.</p>';

  const recent = h.slice().reverse().slice(0, 20).map(x => {
    const q = findQuiz(x.id);
    return '<tr><td>' + fmtDate(x.at) + '</td><td class="t">' + esc(q ? q.title : x.id) + '</td><td class="num">' + x.score + '/' + x.total + '</td><td class="num"><span class="best ' + (x.pct >= PASS ? "pass" : "fail") + '">' + x.pct + '%</span></td><td class="num">' + fmtDur(x.secs || 0) + '</td></tr>';
  }).join("");
  const recentT = '<div class="tablewrap"><table><thead><tr><th>When</th><th>Quiz</th><th class="num">Score</th><th class="num">%</th><th class="num">Time</th></tr></thead><tbody>' + recent + '</tbody></table></div>';

  app.innerHTML = head + tiles +
    '<section class="section"><div class="section-head"><h2>By quiz</h2><span class="hint">Pass mark ' + PASS + '%</span></div>' + table + '</section>' +
    '<section class="section"><div class="section-head"><h2>Accuracy by topic</h2><span class="hint">All attempts, finals included · weakest first</span></div>' + segs + '</section>' +
    '<section class="section"><h2>Most-missed questions</h2>' + missList + '</section>' +
    '<section class="section"><h2>Recent attempts</h2>' + recentT + '</section>' +
    '<div class="actions"><button class="btn ghost" id="reset">Clear my history</button><button class="btn" id="print">Print / save as PDF</button></div>';
  wireReport();
}
function segTitle(id) { const q = findQuiz(id); return q ? q.title : ""; }
function wireReport() {
  document.getElementById("back").onclick = () => { location.hash = ""; };
  document.getElementById("who").onclick = renderIdentity;
  const h2 = document.getElementById("home2"); if (h2) h2.onclick = () => { location.hash = ""; };
  const pr = document.getElementById("print"); if (pr) pr.onclick = () => window.print();
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => {
    if (rs.dataset.armed) { try { localStorage.removeItem(HKEY); localStorage.removeItem("bvq-best"); } catch (e) {} renderReport(); return; }
    rs.dataset.armed = "1"; rs.textContent = "Click again to delete all history";
  };
}

function startQuiz(id) {
  const quiz = findQuiz(id);
  if (!quiz) { location.hash = ""; return; }
  if (!getUser()) { renderIdentity(); return; }
  let pool;
  if (quiz.from) {
    pool = shuffle(quiz.from.flatMap(qid => findQuiz(qid).qs.map(q => q.concat(qid)))).slice(0, quiz.size);
  } else {
    pool = shuffle(quiz.qs.map(q => q.concat(quiz.id)));
  }
  run = {
    quiz, idx: 0, score: 0, missed: [], started: Date.now(),
    items: pool.map(([q, opts, x, s, seg]) => {
      const order = shuffle(opts.map((_, i) => i));
      return { q, opts: order.map(i => opts[i]), correct: order.indexOf(0), x, s, seg, picked: null };
    })
  };
  renderQuestion();
}

function renderQuestion() {
  const { quiz, idx, items } = run;
  const it = items[idx];
  const total = items.length;
  const done = it.picked !== null;
  const letters = "ABCD";
  const opts = it.opts.map((o, i) => {
    let cls = "opt";
    if (done) cls += i === it.correct ? " right" : (i === it.picked ? " wrong" : " dim");
    return '<button class="' + cls + '" data-i="' + i + '"' + (done ? " disabled" : "") + '><span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span></button>';
  }).join("");
  let fb = "";
  if (done) {
    const ok = it.picked === it.correct;
    fb = '<div class="feedback ' + (ok ? "good" : "bad") + '" role="status"><strong>' + (ok ? "Correct" : "Not quite") + '</strong>' +
      (ok ? "" : '<span>Answer: ' + esc(it.opts[it.correct]) + '</span>') +
      (it.x ? '<span>' + esc(it.x) + '</span>' : '') +
      '<span class="src">Revise: ' + esc(it.s) + '</span></div>';
  }
  app.innerHTML =
    '<div class="bar"><button class="back" id="back">← All quizzes</button><span class="count">' + (idx + 1) + ' / ' + total + ' · Score ' + run.score + '</span></div>' +
    '<div class="head"><span class="eyebrow">' + esc(WF_LABEL[quiz.wf]) + (quiz.source ? ' · ' + esc(quiz.source) : '') + '</span><h1>' + esc(quiz.title) + '</h1></div>' +
    '<div class="progress" aria-hidden="true"><i style="width:' + ((idx + (done ? 1 : 0)) / total * 100) + '%"></i></div>' +
    '<div class="qcard"><p class="qtext">' + esc(it.q) + '</p><div class="opts">' + opts + '</div>' + fb +
    '<div class="actions">' + (done ? '<button class="btn" id="next">' + (idx + 1 === total ? "See results" : "Next question") + '</button>' : '<span class="hint">Press A–D or 1–4 to answer</span>') + '</div></div>';
  document.getElementById("back").onclick = () => { location.hash = ""; };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
  const nx = document.getElementById("next");
  if (nx) { nx.onclick = next; nx.focus(); }
}

function pick(i) {
  const it = run.items[run.idx];
  if (it.picked !== null) return;
  it.picked = i;
  if (i === it.correct) run.score++; else run.missed.push(it);
  renderQuestion();
}
function next() {
  if (run.idx + 1 < run.items.length) { run.idx++; renderQuestion(); window.scrollTo(0, 0); }
  else renderResults();
}

function renderResults() {
  const { quiz, items, score, missed } = run;
  const pct = Math.round(score / items.length * 100);
  const pass = pct >= PASS;
  saveBest(quiz.id, pct);
  const segs = {};
  items.forEach(it => { const g = segs[it.seg] || (segs[it.seg] = [0, 0]); g[1]++; if (it.picked === it.correct) g[0]++; });
  const u = getUser() || { name: "", empId: "" };
  const payload = {
    attemptId: newId(), name: u.name, empId: u.empId,
    quizId: quiz.id, quizTitle: quiz.title, workflow: WF_LABEL[quiz.wf], type: quiz.from ? "Final" : "Segment",
    startedAt: new Date(run.started).toISOString(), finishedAt: new Date().toISOString(),
    durationSec: Math.round((Date.now() - run.started) / 1000), correct: score, total: items.length, pct, passed: pass,
    answers: items.map((it, n) => ({ n: n + 1, topic: segTitle(it.seg), question: it.q, chosen: it.opts[it.picked], correctAnswer: it.opts[it.correct], isCorrect: it.picked === it.correct, source: it.s }))
  };
  saveAttempt({ id: quiz.id, at: Date.now(), secs: Math.round((Date.now() - run.started) / 1000), score, total: items.length, pct, segs,
    missed: missed.map(it => ({ q: it.q, a: it.opts[it.correct], s: it.s, seg: it.seg })) });
  const review = missed.map(it =>
    '<div class="miss"><strong>' + esc(it.q) + '</strong>' +
    '<span class="yours">You chose: ' + esc(it.opts[it.picked]) + '</span>' +
    '<span class="ans">Correct: ' + esc(it.opts[it.correct]) + '</span>' +
    (it.x ? '<span class="why">' + esc(it.x) + '</span>' : '') +
    '<span class="src">Revise: ' + esc(it.s) + '</span></div>').join("");
  app.innerHTML =
    '<div class="bar"><button class="back" id="back">← All quizzes</button></div>' +
    '<div class="head"><span class="eyebrow">' + esc(WF_LABEL[quiz.wf]) + ' · Results</span><h1>' + esc(quiz.title) + '</h1></div>' +
    '<div class="qcard"><div class="score"><span class="big">' + pct + '%</span><div style="display:grid;gap:6px">' +
      '<span class="pill ' + (pass ? "pass" : "fail") + '">' + (pass ? "Passed" : "Below " + PASS + "%") + '</span>' +
      '<span class="count">' + score + ' of ' + items.length + ' correct</span></div></div>' +
      '<p class="lede">' + (pass ? (missed.length ? "Passed. Go over the questions you missed below." : "Every answer correct.") : "Go back over the slides listed below, then take the quiz again. Questions and options are reshuffled.") + '</p>' +
      (COLLECT_URL ? '<p class="hint" id="sync">Saving your result…</p>' : '') +
      '<div class="actions"><button class="btn ghost" id="home">All quizzes</button><button class="btn ghost" id="perf">My performance</button><button class="btn" id="again">Take it again</button></div></div>' +
    (missed.length ? '<section class="section"><h2>Questions to review (' + missed.length + ')</h2><div class="review">' + review + '</div></section>' : '');
  document.getElementById("back").onclick = () => { location.hash = ""; };
  document.getElementById("home").onclick = () => { location.hash = ""; };
  document.getElementById("again").onclick = () => startQuiz(quiz.id);
  document.getElementById("perf").onclick = () => { location.hash = "report"; };
  sendAttempt(payload).then(ok => {
    const el = document.getElementById("sync");
    if (el && ok !== null) el.textContent = ok ? "✓ Result saved to training records." : "Couldn't reach training records right now. It will be sent automatically the next time you open the quiz.";
  });
  window.scrollTo(0, 0);
}

document.addEventListener("keydown", e => {
  if (!run || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = run.items[run.idx];
  if (!it) return;
  const k = e.key.toLowerCase();
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
  if (it.picked === null && k in map && map[k] < it.opts.length) { e.preventDefault(); pick(map[k]); }
});

function route() {
  const id = location.hash.replace("#", "");
  if (id === "report") renderReport(); else if (id && findQuiz(id)) startQuiz(id); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
flushOutbox();
</script>

</body></html>
